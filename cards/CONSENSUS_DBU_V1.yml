red_flags:
- Members chosen after seeing their train results; the consensus is its own trial and each member already is one.
- Both earlier consensus cards landed below their best member, diluted by abstain-as-neutral; the same rule is kept
  here so the three are comparable, not because it is expected to win.
- T04_Q06_FB (+3.85 train) released -0.60 on validation; two of its members are here.
- D01C (+2.54 train) left out because its validation answer was -1.05.
- Ranking depends on which stocks are present that date (same caveat as O04).
- Every bullish reading in the lab has a negative directional move after the delivery cost.
- Train split only until a frozen version exists.
