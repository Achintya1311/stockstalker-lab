claim_as_stated: >
  `cards/catalog.csv`: price above the cloud with Tenkan above Kijun bullish,
  the reverse bearish, with the standard 9/26/52 periods. `prior_claim`:
  popular trend system. No published hit rate is cited.
horizon: week
rules_plain: >
  On the adjusted daily series: Tenkan = midpoint of the 9-day high and low,
  Kijun = the 26-day midpoint; the cloud on the last bar is Senkou A
  ((Tenkan + Kijun) / 2) and Senkou B (52-day midpoint), both as of 26 bars
  earlier, so nothing ahead of the last bar is read. Close above the cloud
  with Tenkan above Kijun is bullish, scored by the close's distance above the
  cloud top over the close; close below the cloud with Tenkan below Kijun is
  bearish, scored the same way from the cloud bottom with a negative sign.
  Anything else abstains. Only the trailing 120 rows are read.
default_params:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  shift: 26
data_needed: "ohlcv"
testable_now: "yes"
source: "Hosoda"
link: ""
prior_claim: "Popular trend system"
red_flags:
