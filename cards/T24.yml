claim_as_stated: >
  `cards/catalog.csv`: open above the classic pivot bullish, below bearish,
  with a bounce or break at S1/R1; pivot P = (H + L + C) / 3, R1 = 2P - L,
  S1 = 2P - H from the previous session. `prior_claim`: widely watched
  intraday levels. No published hit rate is cited.
horizon: day
rules_plain: >
  Picks are made before the open, so the next open is not visible. The lab's
  reading: P, R1 and S1 from the second-to-last adjusted bar; the last close
  placed against them, score = (close - P) / (R1 - S1). Positive is bullish,
  negative bearish; a close beyond R1 or S1 scores past +/-0.5, so breaks rank
  above bounces. A bar with no range abstains. Only the last 20 rows are read.
default_params:
  window: 20
data_needed: "ohlcv"
testable_now: "yes"
source: "Floor-trader convention"
link: ""
prior_claim: "Widely watched intraday levels"
