red_flags:
- No claim is assumed true (SPEC.md section 5).
- 'Trial count: 60 new train replays (28 day: 14 per table; 32 week: 17 bullish, 15 bearish), on top of C1''s 34 cells
  and 34 complements (68 replays) and COMPOSITE_V1''s 8. 136 train replays have now been run on the same four triggers
  and the same 2015-2020 data; the best of 60 will look better than it is. The fit/check split inside train (2015-2018
  fit, 2019-2020 check) and the both-sides requirement are the only guards before the single validation query.'
- The candidate gate lists were read off the C1 train table, so every family is built from gates already chosen on the
  same train years.
- Family B never drops a pick, so its coverage is always 100% and its effect is only on which 5 picks the top selection
  reads (the trigger's own reading, scaled up by the number of candidate gates that hold).
- Vote k = 1 with six candidates may keep nearly every trigger pick; it is near-identical to the trigger by design.
- G5 and G9 never judge 2015 (too few rows); threshold configs on them have at most 3 fit years, the minimum.
- Day G2 and every G9 key exist on one side only by construction (see not_built); they can be selected only through
  the one-side-only fallback.
- No complements this round (halves compute), so a config that only shrinks the sample is guarded by the 40% coverage
  floor and the 2019/2020 check, not by a placebo.
- No difference interval: picks.json has no per-pick outcomes (see research/diagnostics/composite_ingredients.md).
- Train split only; validation is a separate, later step, one query per table for the selected config only.
status: 'built; 60 train replays held in experiments/held/v2/ (week 32, day_a 14, day_b 14), none pending'
