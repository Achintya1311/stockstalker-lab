source_url: ''
author: lab-original combination search (COMPOSITE_V2); ingredients from the C1 table (cards/COMPOSITE_INGREDIENTS.yml)
license: own work, summarised only (SPEC.md section 5)
published_on: '2026-11-13'
horizon: day and week (each config uses its trigger's horizon)
claim_as_stated: 'Pre-registered before any COMPOSITE_V2 replay (AB, 13 Nov 2026, after COMPOSITE_V1''s hard AND failed
  on unseen data on both bullish tables): some softer or re-thresholded combination of the C1 gates improves the live
  trigger on BOTH the bullish and the bearish table of a horizon. Every setting is defined by horizon and built on both
  tables of that horizon wherever its gate exists, under one shared config key. Train split only, top selection, the
  trigger''s own side; the trigger''s own train replay is the comparison (no complements this round).'
rules_plain: 'Three families on the four live triggers (day: T04 bullish, E2A bearish; week: A05B bullish, A01 bearish).
  Candidate gates per table = every C1/C4 cell for that trigger whose keep edge was above its complement edge on train:
  day bearish E2A G1 G2 G3 G4 G8 G10; day bullish T04 G3 G4 G7 G9 G10; week bullish A05B G1 G4 G5 G6 G9 G10; week bearish
  A01 G1 G2 G3 G7 G8 G10. A (vote): keep a trigger pick if at least k candidate gates return True; no verdict counts as
  not passed; a pick no candidate gate judged abstains; scores unchanged. B (rank boost): every pick stays, score =
  trigger score x (1 + w x gates passed), sign unchanged, only the order the top selection reads changes. C (threshold):
  trigger AND one gate at an alternative setting through an optional keyword in strategies/g_gates.py whose default is
  the C1 value. Rules in strategies/composite_v2.py; modules generated by scripts/gen_composite_v2.py.'
default_params:
  candidates:
    day_bearish: [g1, g2, g3, g4, g8, g10]
    day_bullish: [g3, g4, g7, g9, g10]
    week_bullish: [g1, g4, g5, g6, g9, g10]
    week_bearish: [g1, g2, g3, g7, g8, g10]
  candidates_excluded_keep_not_above_complement:
    day_bearish: [g5, g6]
    day_bullish: [g5, g6, g8]
    week_bullish: [g2, g7, g8]
    week_bearish: [g4, g5, g6]
  family_a_vote_k: {day: [1, 2, 3, 4, 5], week: [1, 2, 3, 4, 5, 6]}
  family_b_boost_w: [0.25, 0.5, 1.0]
  family_c_thresholds:
    g2: {param: 'leader_top (bearish side; bullish side mirrors as leader_bottom = 1 - value)', c1: 0.70, variants: [0.60, 0.80]}
    g5: {param: stress_quantile (quantile of the trailing 250 values of the 20-day universe volatility), c1: 'median (0.5)', variants: [0.40, 0.60]}
    g8: {param: volume_multiple, c1: 1.5, variants: [1.25, 2.0]}
    g9: {param: near_high (close at least this share of the 252-day high), c1: 0.85, variants: [0.80, 0.90]}
  not_built:
    g3_t04_a01: no numeric threshold (the gate is the sign of the market-adjusted move)
    g9_bearish: G9 is a bullish-only gate (T04, A05B); its keys are one side only by construction
    g2_t04: identity cell skipped in C1 (T04 never picks below the 200-day average), so day G2 keys are E2A only
  dropped_for_budget:
    - 'day_g3_z0p5, day_g3_z1p5: E2A residual-z minimum 0.5 / 1.5 beside 1.0; one side only (T04''s G3 has no threshold)'
    - 'day_vote_k6: E2A 6 of 6; one side only (T04 has 5 candidates) and the all-gates AND is the shape that over-fitted'
  selection:
    selection: top
    fit_years: [2015, 2016, 2017, 2018]
    check_years: [2019, 2020]
    fit_gain: mean over the fit years of (config edge - trigger edge), over fit years where both have an edge
    min_fit_years: 3
    eligible: fit gain > 0 AND config edge > trigger edge in 2019 AND in 2020 AND config dates >= 40% of trigger dates
    min_date_coverage_of_trigger: 0.40
    per_horizon: highest sum of the two fit gains among config keys eligible on both tables (ties - first declared)
    fallback: no key eligible on both -> each table's eligible config with the highest fit gain, marked one side only
    nothing_eligible: the table keeps its plain trigger
    validation: only the selected config per table may later get one validation query
data_needed: ohlcv plus futures OI
testable_now: 'yes'
source: AB request 13 Nov 2026; research/diagnostics/composite_ingredients.md; research/diagnostics/composite_v1.md
link: ''
prior_claim: 'COMPOSITE_V1 (trigger AND every qualifying gate) passed its train rule on all four tables, then failed on
  unseen data on both bullish tables. C1 single cells per table: see research/diagnostics/composite_ingredients.md.'
