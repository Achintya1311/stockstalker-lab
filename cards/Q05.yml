published_on: ""
claim_as_stated: >
  `cards/catalog.csv`: Alpha158's RSQR (R-squared of a linear fit to the last 20
  closes), signed by BETA (the fitted slope). Alpha158 uses both as inputs to a
  learned model; `prior_claim`: no stand-alone hit rate claimed.
horizon: week
rules_plain: >
  On the log of the adjusted close over the last 20 sessions: fit a straight
  line; score = sign(slope) x R-squared. Smooth rises score near +1 (bullish),
  smooth falls near -1 (bearish), choppy windows near 0. A flat window abstains.
  Only the last 20 rows are read.
default_params:
  window: 20
data_needed: "ohlcv"
testable_now: "yes"
source: "microsoft/qlib Alpha158 (MIT)"
link: "https://github.com/microsoft/qlib"
