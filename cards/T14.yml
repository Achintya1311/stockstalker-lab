claim_as_stated: >
  `cards/catalog.csv`'s own reading: "CCI crossing above -100 bullish,
  below +100 bearish." `prior_claim`: "Oscillator." Taken literally and
  exactly as transcribed, not "corrected" to either common CCI convention
  this run is aware of (Lambert's own trend-following breakout reading is
  the mirror image - cross above +100 bullish, below -100 bearish; a
  mean-reversion reading would instead fade the extremes - bullish on a
  bounce off -100, bearish on a fade from +100, which is closer to but
  still not identical to the catalog's exact wording). SPEC.md section 5:
  "No claim is assumed true" - the catalog's own transcription is what
  gets tested here, flagged as a likely transcription slip in red_flags
  below rather than silently fixed, so a `diagnose`-lane look at this
  card's real numbers starts from what was actually tested.
horizon: both
rules_plain: >
  Standard CCI(20) (Lambert 1980) on the adjusted high/low/close series
  (`scripts.adjustments.compute_adjustment_factors`, same as every other
  `strategies/t*` card):

  - Typical price TP = (adj_high + adj_low + adj_close) / 3, per bar.
  - SMA_TP = 20-bar simple moving average of TP.
  - MeanDev = 20-bar mean *absolute* deviation of TP from the current
    bar's own SMA_TP (Lambert's original definition - every TP in the
    trailing 20-bar window compared against the one current SMA_TP value,
    not each bar's own rolling SMA; this is not the standard deviation
    T06/T07's Bollinger bands use).
  - CCI = (TP - SMA_TP) / (0.015 * MeanDev).
  - Like T05's MACD card, the catalog's own wording ("crossing above ...
    below ...") is read as an event, not a persisted state the way T01's
    always-on SMA spread reads - this card only fires on the bar the
    threshold is actually crossed and abstains on every other bar,
    including one where CCI already sits well past a threshold without a
    fresh cross that day.
  - **Bullish:** CCI was at or below -100 on the prior bar and is
    strictly above -100 on the latest bar (a fresh cross up through
    -100).
  - **Bearish:** CCI was at or above +100 on the prior bar and is
    strictly below +100 on the latest bar (a fresh cross down through
    +100).
  - Anything else (no fresh cross through either threshold this bar, or
    MeanDev is exactly 0 so CCI is undefined) abstains (NaN, SPEC.md
    section 3).

  Score is continuous within each firing case, same sign-gives-direction/
  magnitude-gives-conviction convention every other card here uses, scaled
  by CCI's own 100-point threshold unit the way T05 scales by price:
  `score = (CCI_latest - (-100)) / 100` on a bullish cross,
  `score = (CCI_latest - 100) / 100` on a bearish cross. Sign always
  matches the cross direction by construction (CCI_latest is just above
  -100, hence a small positive numerator, right after a bullish cross;
  just below +100, hence a small negative numerator, right after a
  bearish cross) - this bounds the magnitude near 0 right at the crossing
  bar itself, same observation T05's card makes about its own
  just-crossed score.

  Needs no pick-date knowledge - both SMA_TP and MeanDev are computed
  purely from past adjusted high/low/close already inside whatever
  truncated `history` slice `engine.replay` hands this module, so one
  module serves both horizons, the same way T01/T03/T05 already do.

  Minimum history: the 20-bar window needs 20 rows before SMA_TP/MeanDev
  are stable values, plus one more row to have a prior-bar CCI to compare
  against for the cross itself - `MIN_ROWS = 21`. Unlike the full-history
  groupby in T01-T05, this card only ever reads the trailing `MIN_ROWS`
  rows per symbol (`strategies/t07_bollinger_squeeze_breakout.py`'s own
  fixed-tail pattern), since `state/engine-issues.md`'s "Replay took
  1h45m+" WATCH entry already showed what an unbounded per-call
  computation costs multiplied across thousands of real pick dates.
