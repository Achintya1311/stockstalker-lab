published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#12 = sign(delta(volume, 1)) x (-1 x delta(close, 1)), a
  production WorldQuant alpha: a move on rising volume reverses, a move on falling
  volume continues. The paper reports no stand-alone hit rate.
horizon: day
rules_plain: >
  On the last two bars: score = -sign(volume change) x one-day log return of the
  adjusted close. A fall on rising volume or a rise on falling volume is bullish; a
  rise on rising volume or a fall on falling volume is bearish. Unchanged volume or
  close abstains. The log return replaces the paper's raw price change so stocks on
  different price scales rank together. Only the last 2 rows are read.
