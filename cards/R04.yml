# R04: 80-20 (reversal of an extreme bar). Strategy module strategies/r04_eighty_twenty.py (rules in strategies/guru_core.py).
source_url: ""
author: "Linda Bradford Raschke and Laurence A. Connors"
license: "published book / talk; rules restated in the lab's own words, nothing copied (SPEC.md section 5)"
published_on: "1995"
horizon: both
claim_as_stated: >
  After a session that opens near its high and closes near its low, a move below that low the next session often
  fails and reverses. No audited hit rate on NSE stocks.
rules_plain: |
  Bullish (bearish is the mirror: opened in the bottom 20%, closed in the top 20%, then a failed move above the high).
  - Session S-1 has a range above zero, opened in the top 20% of its range and closed in the bottom 20%.
  - The signal session S trades below S-1's low and closes back above it.
  - Score = (S-1's low - S's low) / ATR(14) at S.
  Both sides, one module; a symbol whose two sides fire at once abstains. Daily bars only, split / bonus adjusted, last 250 market dates; the signal session is the last visible session (no lookahead). Judged: symbols with a futures contract on the last visible date and at least 60 rows.
params:
  open_share_min: 0.8
  close_share_max: 0.2
  atr_period: 14
  min_rows: 60
  tail_dates: 250
default_params:
  open_share_min: 0.8
  close_share_max: 0.2
  atr_period: 14
  min_rows: 60
  tail_dates: 250
assumptions:
  - "The book's trigger is intraday back at the prior low; on daily bars S must close above it (owner's reading)."
  - "No ranking is published; the depth of the failed break in ATR units is used, as for R02."
  - "Boundary values count: open exactly at 80% of the range and close exactly at 20% qualify."
data_needed: "ohlcv"
testable_now: "yes"
source: "Raschke and Connors, Street Smarts (1995), 80-20s chapter"
link: ""
prior_claim: "Book claims extreme bars often reverse next session; no audited record"
replays:
  - experiments/held/guru/day/r04-eighty-twenty-day.yml
  - experiments/held/guru/week/r04-eighty-twenty-week.yml
red_flags:
  - "No claim is assumed true (SPEC.md section 5): the card moves to confirmed or refuted only on real replay numbers, train first."
  - "Literal coding with one fixed parameter set; nothing tuned (owner's instruction, 14 Nov 2026). A poor result says the literal daily rule does not work here, not that no variant could."
  - "Scored on the lab's tables (day: open to close of the next session; week: Monday open to Friday close), not on the author's own exit and payoff rules; exit and payoff scoring is being added to engine/ separately."
  - "Selective: abstains on most symbol-dates, so picks per date and coverage must be read next to any hit rate (scripts/guru_report.py prints both)."
  - "Idea vintage (SPEC.md section 5): the train split overlaps the years after publication only partly; any post-publication record is reported separately once numbers exist."
status: "held; 2 train replays (day, week) in experiments/held/guru/, none pending; results via python3 -m scripts.guru_report"
