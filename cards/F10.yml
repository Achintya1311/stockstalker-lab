source_url: "https://arxiv.org/abs/1601.00991"
author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#34"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#34 = rank((1 - rank(stddev(returns, 2) / stddev(returns, 5)))
  + (1 - rank(delta(close, 1)))). A production WorldQuant alpha: calm recent days and a fall
  yesterday score high. The paper reports no stand-alone hit rate.
horizon: day
rules_plain: >
  On adjusted closes: ratio = sample deviation of the last 2 daily log returns over that of
  the last 5; last = yesterday's log return. Percentile-rank both among the stocks scored
  that date; s = (1 - rank(ratio)) + (1 - rank(last)); score = s minus its median. High
  bullish, low bearish. A flat 5-session window abstains. The outer rank is dropped (it is
  monotone) and the raw price change becomes a return, so prices of any level compare.
default_params:
  short_window: 2
  long_window: 5
data_needed: "ohlcv"
testable_now: "yes"
source: "Kakushadze (2016) 101 Formulaic Alphas, Wilmott (X03)"
link: "https://arxiv.org/abs/1601.00991"
prior_claim: "WorldQuant production alpha; paper reports no stand-alone hit rate"
