red_flags:
- Members and the switch were chosen after seeing their train and validation results; the fallback is its own trial and each member already is one.
- The universe check uses the last visible row, not the pick date's own row the engine uses, so a stock can still drop out at the margin.
- T04 often fires on fewer than 5 stocks, so on T04 dates the table can have fewer than 5 picks. Filling to 5 with Q06 is a different trial.
- Train split only until a frozen version exists.
status: "train: day-bullish +3.85 (interval +2.39 to +5.35, 6/6 years, 97% of dates), pre-declared rule not met on coverage; validation released -0.60 (did not agree), T04 stays; see research/diagnostics/t04_q06_fb.md"
