claim_as_stated: 'Pre-registered before the replay: the fallback helps if its top-5 day-bullish edge is at least +3.0,
  with the date-block bootstrap interval above 0, at least 4 of 6 positive train years and bullish picks on at least 99%
  of train dates. That would make a full-coverage day-bullish table close to T04''s level instead of a table left blank
  on about a quarter of days. By construction it equals T04 on the dates T04 fires (about 74%); if Q06 does as well on
  the other dates as on average, the edge is about 0.74 x 3.37 + 0.26 x 2.58 = +3.2. The directional move after costs
  is reported but not required (AB''s edge-only rule for the bullish tables, 26 Oct 2026); it is expected to stay
  negative, as both members'' are. Any gain is a lead needing validation, not a result.'
rules_plain: 'Day-bullish only. Per date: if T04 (Connors RSI(2) inside the 200-day trend) scores any stock bullish that
  looks in the universe on the last visible row (active future, 20-session median turnover at the floor), publish only
  T04''s bullish scores; otherwise publish only Q06''s (long lower wick on the last bar). Bearish scores of both members
  are dropped. Not an average: each pick keeps its member''s own magnitude.'
default_params:
  first: t04_connors_rsi2
  fallback: q06_wick_balance
  switch: T04 has at least one likely-in-universe bullish score that date
data_needed: ohlcv
