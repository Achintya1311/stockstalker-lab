source_url: "https://github.com/microsoft/qlib"
author: "Microsoft Qlib, Alpha158 feature set (MIT); feature list copied in third_party/qlib/loader.py"
license: "MIT reference code; the feature is re-implemented, not copied (SPEC.md section 5)"
published_on: ""
claim_as_stated: >
  `cards/catalog.csv`: Alpha158's RESI, the residual of the last close from a
  straight-line fit to the last 20 closes, over the close. Read as mean reversion
  around the stock's own trend: a close well below its trend line bullish, well above
  bearish. Alpha158 uses it as a model input; `prior_claim`: no stand-alone hit rate
  claimed.
horizon: both
rules_plain: >
  Fit a least-squares line to the last 20 log adjusted closes; resid = today's log
  close minus the line at today; score = -resid. Below the line bullish, above it
  bearish, whatever the line's slope. A zero residual abstains. Only the last 20 rows
  are read.
default_params:
  window: 20
data_needed: "ohlcv"
testable_now: "yes"
source: "microsoft/qlib Alpha158 (MIT)"
link: "https://github.com/microsoft/qlib"
prior_claim: "Feature in Qlib's Alpha158 benchmark set; no stand-alone hit rate claimed"
