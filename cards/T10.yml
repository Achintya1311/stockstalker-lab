red_flags:
  - "No claim is assumed true (SPEC.md section 5): status moves to confirmed/refuted only after a real train (then validation/test) replay - same caveat every ported card here already carries."
  - "The trend filter is this card's own substitution, not the catalog's: Crabel's actual rule trades the breakout of the NR day's own high/low (an intraday trigger this engine's once-before-the-open scoring cannot see at all - SPEC.md section 4), so this card tests the catalog's already-simplified 'pick in the trend filter's direction' reading, not Crabel's original intraday system. A refutation of this card refutes the simplification, not necessarily the original trade; worth noting in research/diagnostics/T10.md once scored, not conflating the two."
  - "NR4 and NR7 overlap by construction (every NR7 day's own trailing 4 sessions are a subset of its trailing 7), so their pick overlap (SPEC.md section 6 gate 8, once either reaches the roster) is expected to be high and should not be read as evidence the two variants agree substantively - they are the same rule at two window lengths, not two independent ideas."
  - "The argmin tie-break (today must be a STRICT new low, not merely tied with an earlier day in the window) is this card's own choice; real adjusted true-range values essentially never tie exactly, so this should almost never change which days fire, but it is untested against the alternative (<=) and flagged here rather than silently assumed equivalent."
  - "Coverage and edge both need SPEC.md section 3's reporting once `engine/experiment_report.py` (state/engine-issues.md's open READY FOR WIRING entry) can score this card's picks - same blocker every ported card since A01 has hit; this card does not change that, it just joins the backlog."
