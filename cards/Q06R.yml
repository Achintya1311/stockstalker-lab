license: "MIT reference code; the feature is re-implemented, not copied (SPEC.md section 5)"
published_on: ""
claim_as_stated: >
  `research/diagnostics/q06.md`: Q06's wick balance treats a tiny-range bar the same
  as a wide one. A long lower wick on a wide bar (a large intraday dip bought back)
  should carry more information than the same shape on a quiet bar.
horizon: day
rules_plain: >
  Q06's score (lower wick share minus upper wick share of the last adjusted bar),
  kept only when the last bar's range (high - low) is at least the median range of
  the 20 sessions before it; narrower bars abstain. Both day tables. Only the last
  21 rows are read.
default_params:
  lookback: 20
  min_range_ratio: 1.0
data_needed: "ohlcv"
testable_now: "yes"
