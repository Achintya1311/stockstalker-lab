prior_claim: 'A strong but intermittent reading backed by an always-on reading of a different kind should keep more of the strong one''s edge than a fallback that is weak on the same quiet dates; untested here'
red_flags:
- Members chosen after seeing their train results (E2A +7.46, F11 +4.47); the fallback is its own trial and each member already is one.
- Two changes against E2A_D01C_FB at once (fallback member and the tradable-pick switch), so a difference cannot be split between them from this replay alone.
- The switch uses the previous session's universe flags; the engine's filter uses the pick date's, so a few dates can still differ.
- E2A fires about 3 stocks a date, so on E2A dates the table usually has fewer than 5 picks.
- Train split only until a frozen version exists.
