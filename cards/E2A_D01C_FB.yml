red_flags:
- Members and the switch were chosen after seeing their train results; the fallback is its own trial and each member already is one.
- E2A fires about 3 stocks a date, so on E2A dates the table usually has fewer than 5 picks. Filling to 5 with D01C is a different trial.
- Train split only until a frozen version exists.
