claim_as_stated: >
  `cards/catalog.csv`'s own reading: "50-day SMA crossing above 200-day
  bullish, below bearish." `prior_claim`: "Popular in media; trend signal,
  slow." No specific paper is cited - this is the "golden cross" / "death
  cross" convention financial media reports on, distinct from
  `cards/T01.yml`'s faster 20/50 pair (champion v1's own trend leg):
  T02 is tested here as its own, slower, standalone signal.
horizon: week
rules_plain: >
  Score = (50-day SMA - 200-day SMA) / |200-day SMA| on the adjusted close
  series, continuous and signed (sign gives direction, magnitude gives
  conviction - same convention `cards/T01.yml` already uses, swapping only
  the window lengths). A symbol abstains until it has at least 200 rows of
  history (the slow SMA's own window).

  `cards/catalog.csv` lists this row's horizon as week only (unlike T01's
  "both") - a 50/200 crossover moves too slowly to plausibly carry a
  one-day signal, so this card is tested on week picks only, per the
  catalog's own horizon field.
default_params:
  fast: 50
  slow: 200
data_needed: "ohlcv"
testable_now: "yes"
