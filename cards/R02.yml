# R02: Turtle Soup (failed 20-session breakout). Strategy module strategies/r02_turtle_soup.py (rules in strategies/guru_core.py).
source_url: ""
author: "Linda Bradford Raschke and Laurence A. Connors"
license: "published book / talk; rules restated in the lab's own words, nothing copied (SPEC.md section 5)"
published_on: "1995"
horizon: both
claim_as_stated: >
  New 20-day extremes that fail (price returns inside the earlier extreme) tend to reverse; designed to fade the
  Turtle channel breakout. No audited hit rate on NSE stocks.
rules_plain: |
  Bullish (bearish is the mirror at 20-session highs).
  - Prior low = the lowest low of the 20 sessions before the signal session S, at its most recent occurrence P.
  - S makes a new 20-session low (its low below the prior low), P is at least 4 sessions before S, and S closes back above the prior low.
  - Score = (prior low - S's low) / ATR(14) at S, the depth of the failed break in ATR units.
  Both sides, one module; a symbol whose two sides fire at once abstains. Daily bars only, split / bonus adjusted, last 250 market dates; the signal session is the last visible session (no lookahead). Judged: symbols with a futures contract on the last visible date and at least 60 rows.
params:
  channel_sessions: 20
  min_sessions_since_prior_extreme: 4
  atr_period: 14
  min_rows: 60
  tail_dates: 250
default_params:
  channel_sessions: 20
  min_sessions_since_prior_extreme: 4
  atr_period: 14
  min_rows: 60
  tail_dates: 250
assumptions:
  - "The book's trigger is intraday at the earlier 20-day low; on daily bars the owner's reading is used: the session must close back above it."
  - "'Made at least 4 sessions earlier' = S minus P >= 4, with P the most recent session at the 20-session low when there are ties."
  - "The book's own filters and exits are not applied; ranking by depth in ATR units is the owner's, not the book's."
data_needed: "ohlcv"
testable_now: "yes"
source: "Raschke and Connors, Street Smarts (1995), Turtle Soup chapter"
link: ""
prior_claim: "Book claims failed breakouts reverse; no audited record"
replays:
  - experiments/held/guru/day/r02-turtle-soup-day.yml
  - experiments/held/guru/week/r02-turtle-soup-week.yml
red_flags:
  - "No claim is assumed true (SPEC.md section 5): the card moves to confirmed or refuted only on real replay numbers, train first."
  - "Literal coding with one fixed parameter set; nothing tuned (owner's instruction, 14 Nov 2026). A poor result says the literal daily rule does not work here, not that no variant could."
  - "Scored on the lab's tables (day: open to close of the next session; week: Monday open to Friday close), not on the author's own exit and payoff rules; exit and payoff scoring is being added to engine/ separately."
  - "Selective: abstains on most symbol-dates, so picks per date and coverage must be read next to any hit rate (scripts/guru_report.py prints both)."
  - "Idea vintage (SPEC.md section 5): the train split overlaps the years after publication only partly; any post-publication record is reported separately once numbers exist."
status: "held; 2 train replays (day, week) in experiments/held/guru/, none pending; results via python3 -m scripts.guru_report"
