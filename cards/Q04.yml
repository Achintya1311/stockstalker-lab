source_url: "https://github.com/microsoft/qlib"
author: "Microsoft Qlib, Alpha158 feature set (MIT); feature list copied in third_party/qlib/loader.py"
license: "MIT reference code; the feature is re-implemented, not copied (SPEC.md section 5)"
published_on: ""
claim_as_stated: >
  `cards/catalog.csv`: Alpha158's IMXD, days since the 60-day low minus days since
  the 60-day high, over 60. A recent high after an old low (a fresh breakout from a
  base) bullish; a recent low after an old high bearish. Alpha158 uses it as an
  input to a learned model; `prior_claim`: no stand-alone hit rate claimed.
horizon: week
rules_plain: >
  On the adjusted high and low over the last 60 sessions including today: imxd =
  (position of the 60-session high - position of the 60-session low) / 60, first
  occurrence on a tie. Positive bullish, negative bearish, zero abstains. A
  tie-break smaller than half a step, 0.008 x tanh(60-session log return / 0.3),
  orders stocks with equal timing by the size of their move. Only the last 60 rows
  are read.
default_params:
  window: 60
  tie: 0.008
data_needed: "ohlcv"
testable_now: "yes"
source: "microsoft/qlib Alpha158 (MIT)"
link: "https://github.com/microsoft/qlib"
prior_claim: "Feature in Qlib's Alpha158 benchmark set; no stand-alone hit rate claimed"
