prior_claim: 'Rank-averaging weak, unrelated signals often beats each member alone; CONSENSUS_WB_V1 (+2.48) did not'
red_flags:
- Members chosen after seeing their train results; the consensus is its own trial and each member already is one.
- 'The combination rule differs from CONSENSUS_WB_V1 and CONSENSUS_DB_V1 (side-anchored ranks), so a difference from v1
  mixes the members with the rule. The change fixes a defect found while writing this card: under v1''s rule a
  one-sided member''s weakest bearish reading ranks below 0.5 and counts against bearish (T05C reads about 9 stocks a
  week, all bearish; Q01C about 46).'
- H02 and F15 are cross-sectional themselves; ranking depends on which stocks are present that week.
- F15's edge was about +5.5 in 2015-17 and +1.9 in 2018-20.
- Train split only until a frozen version exists.
