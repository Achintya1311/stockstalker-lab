claim_as_stated: 'Pre-registered on 10 Nov 2026 before the replay. Four week-bearish readings that each meet the full
  SPEC 10 helps rule on train and barely share names (H02 +3.84, T05C +4.02, F15 +3.65, Q01C +3.26; pairwise top-5
  overlap 1.6-5.6%). With side-anchored ranks, a stock bearish on three members (usually H02, F15 and Q01C, which read
  the most stocks) outranks a lone top T05C reading, so the top five should be the stocks several members agree on.
  Prediction: week-bearish top-5 edge +2.5 to +4.5, directional move after costs +0.10% to +0.25%, picks on every
  train week, top-5 overlap with H02, F15 and Q01C each 10 to 40%, with T05C below 15%. Helps only if: edge at least
  +4.02 (T05C, the best member), 95% interval above 0, at least 5 of 6 years positive, directional move at least
  +0.13% (H02''s). A validation query is spent only if train edge is at least +5.73, since the week-bearish table
  moves off A01 (released +4.73) only on a released edge at least 1 point higher (SPEC.md section 10). Otherwise
  the result is recorded and the week-bearish consensus closes unless it beats every member.'
rules_plain: 'Week-bearish only. Members: H02 (highest stock-specific volatility), T05C (fresh MACD up-cross faded),
  F15 (three up closes on light recent turnover) and Q01C (a fall on thinning volume). Per member, bearish readings
  are ranked among that member''s bearish readings and mapped to (0.5, 1]; bullish readings among its bullish readings,
  mapped to [0, 0.5); zero or abstain = 0.5. Mean over the four; stocks above 0.5 scored -2 x (mean - 0.5). No
  bullish picks.'
default_params:
  members: [h02_idiosyncratic_volatility, t05c_upcross_fade, f15_streak_volume_reversal, q01c_thin_volume_fall]
  ranks: side-anchored
  abstain_as: 0.5
  weights: equal
data_needed: ohlcv
