# P02: Bollinger 1.5 sd alert candle. Strategy module strategies/p02_bollinger_1p5.py (rules in strategies/guru_core.py).
source_url: ""
author: "practitioner variant (alert-candle logic of P01 on John Bollinger's bands)"
license: "published book / talk; rules restated in the lab's own words, nothing copied (SPEC.md section 5)"
published_on: "unknown"
horizon: both
claim_as_stated: >
  A candle wholly outside a 1.5 standard deviation band followed by a break of its opposite extreme marks an
  over-extended move likely to revert toward the middle band. No audited hit rate on NSE stocks.
rules_plain: |
  - Bands at the alert candle A (the session before the signal session S): SMA(20) of close plus or minus 1.5 population standard deviations of the same 20 closes.
  - Bullish: A's high below the lower band, and S trades above A's high.
  - Bearish: A's low above the upper band, and S trades below A's low.
  - Score = distance of A's nearer extreme from the band it cleared / ATR(14) at A.
  Both sides, one module; a symbol whose two sides fire at once abstains. Daily bars only, split / bonus adjusted, last 250 market dates; the signal session is the last visible session (no lookahead). Judged: symbols with a futures contract on the last visible date and at least 60 rows.
params:
  bb_period: 20
  bb_sd: 1.5
  sd_form: population (ddof 0)
  atr_period: 14
  min_rows: 60
  tail_dates: 250
default_params:
  bb_period: 20
  bb_sd: 1.5
  sd_form: population (ddof 0)
  atr_period: 14
  min_rows: 60
  tail_dates: 250
assumptions:
  - "Bands follow Bollinger's definition: 20-period simple average of close, population standard deviation, here at 1.5 instead of 2."
  - "The alert candle is only the session before S, and must be wholly outside the band (high below the lower band, or low above the upper band)."
  - "Ranking by distance from the band in ATR units mirrors P01 (owner's instruction 'as above')."
data_needed: "ohlcv"
testable_now: "yes"
source: "Bollinger bands (John Bollinger, Bollinger on Bollinger Bands, 2001) with a 1.5 standard deviation width, used in the alert-candle style popularised alongside the Five-EMA method; no single author"
