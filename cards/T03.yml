red_flags:
  - "No claim is assumed true (SPEC.md section 5): status moves to confirmed/refuted only after a real train (then validation/test) replay, not from the catalog's own 'most common retail rule' prior - popularity is not evidence of edge, same caveat T01/T02's media-popularity priors already carry."
  - "This is the same RSI(14) formula half of `strategies/champion_v1.py`'s momentum component already uses (re-centred continuously, not thresholded); once both have train results it is worth checking pick overlap directly (SPEC.md section 6 gate 8) rather than assuming the threshold gating decorrelates them enough on its own."
  - "The 30/70 thresholds are the textbook convention, not tuned on NSE data - a `tune`-lane candidate once a real train edge exists worth tuning (SPEC.md section 8), and the catalog's own '20/80' aside is the natural first alternative to compare against, not a continuous grid point."
  - "Selective by construction (abstains outside the two bands): coverage (SPEC.md section 3) should be reported alongside accuracy once `engine/experiment_report.py` (state/engine-issues.md) can score this card's picks - a threshold rule firing on only a small share of symbol-dates is expected, not a bug, but needs the real coverage number before any accuracy figure is read on its own."
