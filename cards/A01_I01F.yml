prior_claim: 'Short-term reversal is reported to be stronger against the longer trend; untested here'
red_flags:
- The filter and its threshold were chosen after seeing A01's and I01's train results; this card is its own trial and both members already are trials.
- Only 7% of I01's week-bearish top five are A01's, so the filter will drop many of A01's top picks and the table may hold fewer than five on some dates.
- No 2015 picks (I01 needs 253 rows); compare against A01 on 2016-2020, not A01's full-split number.
- Train split only until a frozen version exists.
