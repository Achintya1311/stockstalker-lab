link: ''
status: queued
claim_as_stated: 'O01''s order-block side, kept only when T01''s SMA(20,50) spread has the same sign.
  Tests whether an order block is only a trend signal in disguise (docs/orderblock_hypotheses.md).'
rules_plain: 'Score = O01''s own signed proximity score, unchanged, for a symbol only when ALL of: (1)
  O01 has a valid, unmitigated zone with price at it (O01''s own abstain rule otherwise applies first);
  (2) T01''s SMA(20,50) spread for the same symbol is not NaN (enough history); (3) the sign of T01''s
  spread matches O01''s side (positive spread for a bullish zone, negative for a bearish one). Any other
  case abstains, including wherever T01''s spread is exactly 0.0.'
default_params:
  ob: as O01 (ob_core.DEFAULTS, max_dist_atr 2.0)
  trend: as T01 (SMA 20/50, unchanged)
source: docs/orderblock_hypotheses.md
prior_claim: Tests whether order blocks are only a trend signal in disguise
red_flags:
- No claim is assumed true (SPEC.md section 5).
- 'Both horizons (unlike O02''s day-only restriction): T01 serves day and week picks identically, so
  there is no missing-horizon gap the way D01''s day-only OI reading left O02.'
- 'Imports `strategies/o01_order_block_retest.py` and `strategies/t01_sma_crossover.py` as libraries
  rather than copying their logic, the same convention O02 already uses for D01: this card''s whole
  point is testing OB+trend against the bare retest, so it must stay bit-for-bit consistent with the
  already-queued O01 train replay, not a close reimplementation that could silently drift.'
- 'Inherits O01''s MIN_ROWS=60 floor and T01''s MIN_ROWS=50 floor unchanged; since 60 > 50, T01 never
  abstains for insufficient history on a symbol O01 has already accepted, so there is no reachable case
  where O01 fires but T01 lacks enough history to read.'
- Selective strategy, and more so than O01 alone (a strict subset of O01's own picks): report coverage.
- 'Noticed while building this card''s own test fixtures (not from a real-data run): a bare retest impulse
  (the 1.5-ATR bar that defines an order block) by itself nudges the trailing SMA(20) just enough that T01''s
  spread already agrees with O01''s side on a short, otherwise-flat synthetic series, with no separate
  background trend needed. If that holds on real data too, O03 could end up close to a near-subset of O01
  rather than a genuinely independent filter - worth checking the real train replay''s pick overlap between
  O01 and O03 once both are scored, not assumed from a synthetic fixture alone.'
