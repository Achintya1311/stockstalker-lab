    one-day-lagged reinterpretation of the same mechanism, not the literal
    same-day gap-fade trade practitioners describe. If the true same-day
    effect and this lagged one don't share a sign or a magnitude,
    confirming or refuting this card says nothing about the literal claim,
    only about the lagged variant. Closing this gap for real would need the
    pick timing itself to move - picks made after the open, using that
    day's own open - which SPEC.md section 10 already rules out for
    *published* picks ('before the open'), so even an engine change
    couldn't close it without a SPEC change; not filed in
    state/engine-issues.md since there is no code fix to propose, only a
