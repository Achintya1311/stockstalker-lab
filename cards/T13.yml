claim_as_stated: >
  `cards/catalog.csv`'s own reading: "%R below -80 bullish (oversold),
  above -20 bearish (overbought)." `prior_claim`: "Oscillator."
  `default_params`: "14" (the lookback window). The catalog's wording
  here is "below"/"above", not "crossing" - the same persisted-state
  reading `cards/T03.yml`'s RSI 30/70 thresholds uses, unlike
  `cards/T12.yml`'s Stochastic card (whose catalog row literally says
  "crossing"). This card fires on every bar %R sits past either
  threshold, not only on the bar it first crosses.
horizon: day
rules_plain: >
  Williams %R on the adjusted high/low/close series
  (`scripts.adjustments.compute_adjustment_factors`, same as every other
  `strategies/t0*` card):

  - `%R = -100 * (highest_high_14 - close) / (highest_high_14 -
    lowest_low_14)`, over a trailing 14-day window of adjusted high/low.
    Bounded to [-100, 0]: -100 when close sits at the window low, 0 when
    close sits at the window high - the mirror image of `cards/T12.yml`'s
    raw %K (`%R = raw_%K - 100`), but read directly off %R's own [-100, 0]
    scale rather than converted from %K.
  - **Bullish:** %R < -80 (close near the 14-day low; oversold).
  - **Bearish:** %R > -20 (close near the 14-day high; overbought).
  - Anything else (%R inside [-80, -20]) abstains (NaN, SPEC.md section 3)
    - the same always-fires-while-past-the-boundary reading
    `cards/T03.yml`'s RSI thresholds use, not an event confined to the
    crossing bar the way `cards/T12.yml`'s Stochastic card reads.

  Score is continuous within each active zone, reusing `cards/T03.yml`'s
  threshold-distance convention: on the bullish side,
  `score = (-80 - r) / 20` (0 at r=-80, 1.0 as r approaches -100); on the
  bearish side, `score = -(r - (-20)) / 20` (0 at r=-20, -1.0 as r
  approaches 0) - the boundary-to-edge distance is 20 on both sides,
  since -80 is 20 above the -100 floor and -20 is 20 below the 0 ceiling,
  the same symmetric shape T03's 30/70-against-[0,100] distances have.
  Unlike T12, this uses the LATEST bar's %R (not the prior bar's) since
  there is no crossing condition constraining it - the latest reading is
  exactly what "oversold"/"overbought" means here, same as T03's RSI
  reads its own latest value.

  `strategies/t13_williams_r.py` needs no pick-date knowledge - the
  rolling high/low window is computed purely from past adjusted prices
  already inside whatever truncated `history` slice `engine.replay` hands
  this module. Catalog lists this card's horizon as day only (unlike
  T01/T03's "both"), so only a day-split experiment is queued.

  Minimum history: the 14-day rolling high/low window needs 14 rows
  before %R is a real value (not a partial-window artefact); unlike
  T12's extra "+1 row for the prior-bar comparison" (needed there only
  because of the crossing condition), this card reads only the latest
  bar, so `MIN_ROWS = 14` with no extra row.
default_params:
  period: 14
  oversold: -80
  overbought: -20
