source_url: "https://www.openassetpricing.com/"
author: "Andrew Ang, Robert J. Hodrick, Yuhang Xing and Xiaoyan Zhang, The Cross-Section of Volatility and Expected Returns, Journal of Finance 61(1), 2006"
license: "Idea from the paper, summarised and re-implemented (SPEC.md section 5)"
published_on: "2006"
claim_as_stated: >
  `cards/catalog.csv` (X05 and the paper): stocks with high idiosyncratic volatility
  over the past month earn much lower subsequent returns than stocks with low
  idiosyncratic volatility (US, monthly).
horizon: week
rules_plain: >
  On adjusted closes: m = equal-weighted mean daily log return of the F&O stocks visible
  each date; over the last 20 daily returns, regress each stock's return on m and take
  the standard deviation of the residual (ivol). Score = log(median ivol that date) -
  log(ivol): calmer than the median bullish, more volatile bearish. A gap in the window
  abstains. The paper's three-factor residual becomes a one-factor residual (no size or
  value data).
default_params:
  window: 20
data_needed: "ohlcv"
testable_now: "yes"
source: "Ang, Hodrick, Xing and Zhang (2006) J. Finance; Open Source Asset Pricing (X05)"
link: "https://www.openassetpricing.com/"
prior_claim: "High idiosyncratic volatility stocks earn much lower subsequent returns (US, monthly)"
