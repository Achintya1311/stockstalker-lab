source_url: "https://arxiv.org/abs/1601.00991"
author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#60"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#60 = -(2 x scale(rank(close location value x volume)) -
  scale(rank(ts_argmax(close, 10)))). A production WorldQuant alpha: closes near the bar's high on
  heavy volume are faded, closes after a recent 10-day high favoured. The paper reports no
  stand-alone hit rate.
horizon: day
rules_plain: >
  Last bar's close location value ((close - low) - (high - close)) / (high - low) times its
  turnover, and the position (1 oldest to 10 last) of the highest adjusted close in the last 10
  sessions. Each is percentile-ranked among the stocks with a future on the last date and scaled to
  sum to one; raw = scaled high-position rank - 2 x scaled flow rank; score = raw - median. A close
  at the bar's high on heavy turnover with an old 10-session high bearish; a close at the bar's low
  with a fresh high bullish. A bar with high = low abstains.
default_params:
  window: 10
data_needed: "ohlcv"
testable_now: "yes"
source: "Kakushadze (2016) 101 Formulaic Alphas, Wilmott (X03)"
