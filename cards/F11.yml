author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#38"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#38 = -rank(Ts_Rank(close, 10)) x rank(close / open). A
  production WorldQuant alpha: a close at the top of its 10-day range after an up bar is
  faded. The paper reports no stand-alone hit rate.
horizon: day
rules_plain: >
  Time-series rank of the last adjusted close among its last 10 (ties averaged, divided by
  10) and the last bar's close / open, each percentile-ranked among the stocks scored that
  date; p = product of the two ranks; score = median(p) - p. Top of range on an up bar
  bearish, bottom of range on a down bar bullish. The paper's form is one-signed; the
  bullish side comes from the lab's median centring.
default_params:
  window: 10
data_needed: "ohlcv"
testable_now: "yes"
source: "Kakushadze (2016) 101 Formulaic Alphas, Wilmott (X03)"
link: "https://arxiv.org/abs/1601.00991"
prior_claim: "WorldQuant production alpha; paper reports no stand-alone hit rate"
