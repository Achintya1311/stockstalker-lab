author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#23"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#23 = when the high is above its 20-day mean, minus the
  2-day change in the high, else 0. A production WorldQuant alpha: a fresh push higher is
  faded. The paper reports no stand-alone hit rate.
horizon: day
rules_plain: >
  On the adjusted high: when today's high is above the mean of the last 20 highs
  (today's included), score = minus the log change in the high over 2 sessions;
  otherwise abstain. A push higher is bearish; a lower high still above the mean is
  bullish. Only the last 20 rows are read.
default_params:
  window: 20
  lag: 2
data_needed: "ohlcv"
testable_now: "yes"
