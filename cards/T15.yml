red_flags:
  - "No claim is assumed true (SPEC.md section 5): status moves to confirmed/refuted only after a real train (then validation/test) replay - the rule's name recognition is not evidence of edge, same caveat every ported card here already carries."
  - "ADX gives no direction of its own - the catalog's rule is explicitly a chooser between two OTHER rules it never names. This card pairs it with the two simplest already-ported representatives of each family (T01's SMA(20,50) spread for 'trend rules', T03's RSI(14) 30/70 for 'mean-reversion rules') rather than inventing new ones. A different trend or mean-reversion rule would give a different T15 result entirely - this card tests one specific pairing, not 'ADX regime filtering' in general. If this card shows no edge, that is evidence about THIS pairing, not necessarily about ADX regime-switching as a concept; a `diagnose`-lane look should try pairing ADX with other already-ported rules (T02's 50/200 cross, T12's stochastic) before concluding the concept itself fails."
  - "This card's result is mechanically bounded by T01's and T03's own real train edges (SPEC.md section 5's own prior_claim already says ADX is 'best tested combined with others', i.e. not expected to add a signal on its own) - a `diagnose`-lane look, once all three are scored, should check whether T15 beats T01-filtered-to-its-own-ADX>25-dates and T03-filtered-to-its-own-ADX<20-dates (the counterfactual of regime-switching adding nothing over just running each rule everywhere), not just whether T15 alone clears the gates."
  - "The 20/25 ADX threshold pair and the 14-bar period are Wilder's stated defaults, not tuned on NSE data at all - a `tune`-lane candidate once a real train edge exists (SPEC.md section 8)."
  - "The DX->ADX second smoothing pass uses a different seed convention (simple mean of DX's own first 14 valid values) than the `_wilder_smooth` helper every other card copies (which skips one 'lost to a diff' leading value) - a deliberate choice documented in rules_plain above, since DX carries no such leading value to skip, but worth a unit test cross-check against an independent loop-based reference rather than trusting the two slightly different smoothing shapes agree by inspection alone."
  - "+DI/-DI/DX are defined as 0 (not NaN/abstain) wherever the denominator is 0 (a genuinely flat bar) - a faithful 'no trend' reading for ADX itself, but it means a long dead-flat stretch early in a symbol's history could pull the ADX<20 mean-reversion branch's RSI gate into play on a symbol that is simply illiquid or newly listed, not actually range-bound. Worth checking in a `diagnose`-lane look if this card's mean-reversion side shows an unusual concentration of picks right after a listing or long halt."
status: untested
