published_on: "1960"
claim_as_stated: >
  `cards/catalog.csv`: close above the upper Keltner channel bullish, below
  the lower bearish, with a 20-day EMA and a 2x ATR band. `prior_claim`:
  breakout. No published hit rate is cited.
horizon: week
rules_plain: >
  On the adjusted series: middle = 20-day EMA of the close; ATR = mean of the
  last 20 true ranges; upper/lower = middle +/- 2 ATR. A close above the upper
  channel is bullish, scored by how many ATRs it cleared the band by; a close
  below the lower is bearish, scored the same way with a negative sign; a
  close inside abstains. Only the trailing 200 rows are read.
default_params:
  ema_span: 20
  atr_window: 20
  mult: 2.0
