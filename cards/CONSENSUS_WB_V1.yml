red_flags:
- Members were chosen after seeing their train results, a researcher degree of freedom; the consensus counts as its own trial and each member already is one. Only validation can confirm it.
- Ranking depends on which stocks are present that date (same caveat as O04).
- Treating abstention as neutral is a design choice made before the replay; skipping abstainers instead (O04's rule) is a different trial, not a tune of this one.
- Train split only until a frozen version exists.
