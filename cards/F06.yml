source_url: "https://arxiv.org/abs/1601.00991"
author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#46"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#46 compares the last 10 sessions' average daily
  change with the previous 10 sessions'. A trend that speeds up past a threshold is
  faded (-1), one that slows down is read as turning (+1), and in between the last
  day's change reverses. A production WorldQuant alpha; no stand-alone hit rate.
horizon: both
rules_plain: >
  On the log adjusted close: x = (mean daily log return of the last 10 sessions) -
  (mean of the 10 before). x above 0.00625 (the paper's 0.25 dollars on a $40 stock):
  score -x, bearish. x below 0: score -x, bullish. Otherwise score = minus today's log
  return. Zero abstains. The paper's constant +-1 is replaced by +-|x| so top fives are
  not alphabetical ties. Only the last 21 rows are read.
default_params:
  half: 10
  threshold: 0.00625
data_needed: "ohlcv"
testable_now: "yes"
source: "Kakushadze (2016) 101 Formulaic Alphas, Wilmott (X03)"
link: "https://arxiv.org/abs/1601.00991"
prior_claim: "WorldQuant production alpha; paper reports no stand-alone hit rate"
