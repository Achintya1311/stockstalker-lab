source_url: "https://www.openassetpricing.com/"
author: "Tarun Chordia, Avanidhar Subrahmanyam and V. Ravi Anshuman, Trading activity and expected stock returns, Journal of Financial Economics 59(1), 2001"
license: "Idea from the paper, summarised and re-implemented (SPEC.md section 5)"
published_on: "2001"
claim_as_stated: >
  `cards/catalog.csv` (X05 and the paper): stocks whose trading activity is more
  variable earn lower subsequent returns (US, monthly).
horizon: week
rules_plain: >
  Coefficient of variation (std / mean) of daily traded value in rupees over the last
  60 sessions. Score = log(median CV that date) - log(CV): steadier trading than the
  median bullish, more erratic bearish. A missing session in the window abstains. The
  paper's 36 months of monthly turnover become 60 daily sessions.
default_params:
  window: 60
data_needed: "ohlcv (turnover)"
testable_now: "yes"
source: "Chordia, Subrahmanyam and Anshuman (2001) J. Financial Economics; Open Source Asset Pricing (X05)"
link: "https://www.openassetpricing.com/"
prior_claim: "Stocks with more variable trading activity earn lower returns (US, monthly)"
red_flags:
  - "Pre-declared before the replay (30 Oct 2026): erratic turnover marks news and event weeks, which H02 suggests lean bearish, but turnover spikes also follow results and index changes in both directions. Prediction: week bearish +0.5 to +3.0, week bullish -1.0 to +1.5, bullish directional move negative (delivery cost), bearish directional move -0.10% to +0.10%; top-5 bearish overlap with H02 20 to 50%, with A07C under 20%. Helps, bearish (full SPEC 10 rule): +2.0, interval above 0, 4 of 6 years and a positive directional move; it ranks behind H02 for a week-bearish query unless its train edge beats H02's +3.84. Helps, bullish (edge-only rule): +2.0, interval above 0, 4 of 6 years; a query only if train is at least +3.23."
  - "F&O stocks are all heavily traded, which narrows the spread of CV the paper relied on."
  - "Cross-sectional only through the day's median; the audit fixes the median and checks no later row moves other scores."
status: "train: 1.65 week-bull / 1.14 week-bear; noise, not eligible (see research/diagnostics/h03.md)"
