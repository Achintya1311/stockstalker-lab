source_url: ""
author: "Zhi Da, Qianqiu Liu and Ernst Schaumburg, A Closer Look at the Short-Term Return Reversal, Management Science 60(3), 2014"
license: "Idea from the paper, summarised and re-implemented (SPEC.md section 5)"
published_on: "2014"
claim_as_stated: >
  `cards/catalog.csv` (X04 and the paper): short-term reversal is stronger and more
  persistent once last week's return is stripped of its market (and industry) part,
  so the stock-specific part of last week's move is what reverses (US stocks).
horizon: week
rules_plain: >
  On adjusted closes: m = equal-weighted mean daily log return of the F&O stocks
  visible each date; beta of each stock against m over the 60 sessions before last
  week; residual = sum over the last 5 sessions of (stock log return - beta x m);
  score = -residual. Biggest residual losers bullish, biggest residual winners
  bearish. A gap in the window abstains. Industry adjustment is left out (no sector
  data in the dataset).
default_params:
  lookback: 5
  beta_window: 60
data_needed: "ohlcv"
testable_now: "yes"
source: "Da, Liu and Schaumburg (2014) Management Science; Quantpedia (X04)"
link: ""
prior_claim: "Residual reversal is stronger and more persistent than raw short-term reversal (US)"
