source_url: ''
author: lab-original combined rule (C2); ingredients from the C1 table (cards/COMPOSITE_INGREDIENTS.yml)
license: own work, summarised only (SPEC.md section 5)
published_on: '2026-11-12'
horizon: day and week (each composite uses its trigger's horizon)
claim_as_stated: 'Pre-registered before any composite replay: on each live table, the trigger AND every C1 gate that
  qualified for it improves the trigger alone. Success rule per table, all three required, on the train split, top
  selection, the trigger''s own side: (1) the composite''s edge is above the trigger''s edge; (2) the composite-minus-trigger
  edge difference is positive in at least 4 of the 6 train years (a year without composite picks counts as not positive);
  (3) the composite fires on at least 40% of the trigger''s dates (composite dates / trigger dates). A table that fails
  keeps its plain trigger, and the report says so. The complement (trigger AND NOT all gates, among picks every gate
  judged) is reported next to it and is a placebo, not a hypothesis.'
rules_plain: 'One combined rule per live table, the trigger AND every qualifying gate, exactly as listed in
  research/diagnostics/composite_ingredients.md (34 cells, 7 qualify): day bearish = E2A AND G2; day bullish = T04 AND
  G3 AND G4 AND G7 AND G9; week bullish = A05B AND G5; week bearish = A01 AND G8. Gates are imported unchanged from
  strategies/g_gates.py; no gate is added, dropped or re-thresholded. A pick is kept only if every listed gate returns
  True; a pick any gate cannot judge abstains (in the composite and in the complement). Survivors keep the trigger''s
  own unchanged score, so the engine ranks them as it ranks the trigger. Rules in strategies/composite_v1.py.'
default_params:
  day_bearish: {trigger: e2a, gates: [g2]}
  day_bullish: {trigger: t04, gates: [g3, g4, g7, g9]}
  week_bullish: {trigger: a05b, gates: [g5]}
  week_bearish: {trigger: a01, gates: [g8]}
  gate_thresholds: as C1 (RESEARCH.md section 4; G9 in RESEARCH_2_VERIFIED.md section 4); none changed
  success_rule:
    selection: top
    composite_edge_above_trigger_edge: true
    min_years_composite_above_trigger: 4
    train_years: 6
    min_date_coverage_of_trigger: 0.40
data_needed: ohlcv plus futures OI
testable_now: 'yes'
source: finance-portfolio-hub projects/combined-strategy/RESEARCH.md section 5 (C2); research/diagnostics/composite_ingredients.md
