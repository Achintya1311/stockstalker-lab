red_flags:
- No claim is assumed true (SPEC.md section 5).
- 'Trial count: 4 composites + 4 complements = 8 new train replays, on top of C1''s 34 cells and their 34 complements
  (68 replays); every scored replay is recorded in ledger/trials.csv. The gates were chosen after reading the C1 train
  table, so the composites are selected on the same train data they are judged on.'
- Three of the four composites are a single C1 cell under a new name (E2A AND G2, A05B AND G5, A01 AND G8); their replays
  should reproduce those cells' picks exactly, so only day bullish (four gates) is a genuinely new combination.
- 'Day bullish: G9 needs 252 rows, so the composite has no 2015 picks; under the success rule 2015 counts as not positive,
  leaving at most 5 of 6 years.'
- Complements are placebos for the gate set, not hypotheses; a composite that only shrinks coverage is not a success,
  which is why the 40% date-coverage floor is part of the rule.
- G5 gives one verdict per date for every pick, so the week-bullish composite is a date filter; coverage is read next to edge.
- No difference interval: picks.json has no per-pick outcomes (see research/diagnostics/composite_ingredients.md).
- Train split only; validation is a separate, later step.
status: 'built; 8 train replays held in experiments/held/c2/ awaiting review'
