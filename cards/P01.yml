# P01: Five-EMA alert candle (daily adaptation). Strategy module strategies/p01_five_ema.py (rules in strategies/guru_core.py).
source_url: ""
author: "Subasish Pani (Power of Stocks)"
license: "published book / talk; rules restated in the lab's own words, nothing copied (SPEC.md section 5)"
published_on: "unknown (popularised around 2021)"
horizon: both
claim_as_stated: >
  On intraday index charts (5-minute bars for the bearish side, 15-minute for the bullish side), a candle wholly
  clear of the 5 EMA followed by a break of its opposite extreme marks an over-extended move likely to revert
  toward the average. The author presents it for intraday index options; it was not published for daily stock
  bars. No audited hit rate on NSE stocks.
rules_plain: |
  This is a DAILY ADAPTATION; the original is a 5 and 15 minute method.
  - Alert candle A = the session before the signal session S.
  - Bearish: A's low above its EMA(5), and S trades below A's low.
  - Bullish: A's high below its EMA(5), and S trades above A's high.
  - Score = distance of A's nearer extreme from the EMA at A / ATR(14) at A (bullish positive, bearish negative).
  Both sides, one module; a symbol whose two sides fire at once abstains. Daily bars only, split / bonus adjusted, last 250 market dates; the signal session is the last visible session (no lookahead). Judged: symbols with a futures contract on the last visible date and at least 60 rows.
params:
  ema: 5
  atr_period: 14
  min_rows: 60
  tail_dates: 250
default_params:
  ema: 5
  atr_period: 14
  min_rows: 60
  tail_dates: 250
assumptions:
  - "Daily bars replace the author's 5 and 15 minute bars, on stocks rather than the index: a different timeframe and instrument from what was published, stated here plainly."
  - "Only the session immediately before S can be the alert candle (the most recent clear candle replaces any earlier one in the original); an alert not broken on the very next session expires."
  - "The break is intraday (S's high or low beyond A's), as in the original; scoring starts from the next session's open, not from the break level."
  - "The author's risk-reward and exit rules are not applied; ranking by distance in ATR units is the owner's."
data_needed: "ohlcv"
testable_now: "yes"
source: "Subasish Pani's 5 EMA strategy, as presented in his public talks and videos (Power of Stocks)"
link: ""
prior_claim: "Practitioner claim for intraday index trading; no audited record; untested on daily stock bars"
replays:
  - experiments/held/guru/day/p01-five-ema-day.yml
  - experiments/held/guru/week/p01-five-ema-week.yml
red_flags:
  - "No claim is assumed true (SPEC.md section 5): the card moves to confirmed or refuted only on real replay numbers, train first."
  - "Literal coding with one fixed parameter set; nothing tuned (owner's instruction, 14 Nov 2026). A poor result says the literal daily rule does not work here, not that no variant could."
  - "Scored on the lab's tables (day: open to close of the next session; week: Monday open to Friday close), not on the author's own exit and payoff rules; exit and payoff scoring is being added to engine/ separately."
  - "Selective: abstains on most symbol-dates, so picks per date and coverage must be read next to any hit rate (scripts/guru_report.py prints both)."
  - "Idea vintage (SPEC.md section 5): the train split overlaps the years after publication only partly; any post-publication record is reported separately once numbers exist."
status: "held; 2 train replays (day, week) in experiments/held/guru/, none pending; results via python3 -m scripts.guru_report"
