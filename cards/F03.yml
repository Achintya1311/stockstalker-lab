author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#9"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#9, a one-day reversal that switches to continuation
  when the last 5 daily changes all share a sign. A production WorldQuant alpha; the
  paper reports no stand-alone hit rate.
horizon: day
rules_plain: >
  On the adjusted close: r = the last 5 daily log returns. If all 5 are above zero, or
  all below, score = today's return (continuation); otherwise score = minus today's
  return (reversal). A zero return abstains. Log returns replace the paper's raw
  price changes so stocks on different price scales rank together. Only the last 6
  rows are read.
default_params:
  run: 5
data_needed: "ohlcv"
testable_now: "yes"
source: "Kakushadze (2016) 101 Formulaic Alphas, Wilmott (X03)"
