prior_claim: "WorldQuant production alpha; paper reports no stand-alone hit rate"
red_flags:
  - "Pre-declared before the replay (27 Oct IST): outside a 5-session run this is A02's fade of the day's biggest moves (A02 day bearish +4.34, day bullish -1.10; F02, its volume-signed relative, day bearish +3.26). Runs of five same-sign days are rare, so most top-five picks are reversals. Prediction: day bearish +2.5 to +4.5 with a directional move near zero, day bullish -1.5 to +0.5. Helps, bearish (full SPEC 10 rule): +2.0, interval above 0, 4 of 6 years, positive directional move. Helps, bullish (AB's edge-only rule): +2.0, interval above 0, 4 of 6 years. Check overlap with A02 and F02 first; a reading that repeats A02 adds a trial, not information."
  - "Alpha#9 was designed for a cross-sectional long-short book on US stocks, not a top-5 table on NSE F&O stocks."
