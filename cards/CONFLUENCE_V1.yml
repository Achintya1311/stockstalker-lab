- {folder: experiments/held/conf/ablation_week, ids: [conf-min4-no-ob-week, conf-min4-no-sr-week, conf-min4-no-sweep-week, conf-min4-no-candle-week, conf-min4-no-ema-week, conf-min4-no-oi-week, conf-min4-no-market-week]}
red_flags:
- No claim is assumed true (SPEC.md section 5). This is a discretionary method with no audited record; the rules
  above are one honest mechanical reading of it, and a practitioner could reasonably define every component
  differently.
- 'Trial count: 10 modules x 2 horizons = 20 train replays, 40 side readings (ledger/trials.csv counts one row per
  side). Seven of the ten modules are ablations, descriptive only, but they are still trials. Three minimum counts
  per table compete for one selection.'
- 'No volatility index and no overseas index series exist in the dataset. The market component is a stand-in built
  from the lab''s own universe: an equal-weight index trend (G10) and its 20-day realised volatility against its
  250-day median (G5). It is not the India VIX and not a global market reading.'
- Daily bars are used for the week horizon too (the history ends at Friday's close); no weekly-bar reading.
- 'The market component never judges 2015 (G5 needs 270 universe-return dates), so in 2015 the count is out of 6
  readable components at most; G7 has no verdict where futures OI is missing.'
- Several components reuse readings already tested in this lab (order blocks O01 / G6, D01C, G5, G10), on the same
  2015-2020 data; their individual train results were seen before this card was written.
- The open-interest component is True on exactly one side for every symbol with OI data (D01C's sign), and the
  moving-average component is True on at most one side, so the counts lean on the side those readings point to.
- 'No difference interval: picks.json has no per-pick outcomes.'
- Train split only; validation is a separate, later step, one query per table for the selected count only.
status: 'built; 20 train replays held in experiments/held/conf/ (main_day 3, main_week 3, ablation_day 7, ablation_week 7), none pending'
