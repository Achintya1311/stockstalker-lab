red_flags:
  - "Direction not assumed (SPEC.md section 5): the catalog states only that expiry weeks behave differently, not which way. Both variants' score is simply the historical bucket mean, so the sign (bullish/bearish tilt) comes entirely from whatever the real train data shows, same as C01/C02."
  - "The day variant's proxy misreads the day right after expiry Friday as still 'expiry week' (yesterday, expiry Thursday, was in-week; today, the contract has already rolled) - a known blur, not a leak, same shape as C01's own weekday-proxy caveat."
  - "The week variant's +7-day marker assumes the last visible trading day really is a Friday (true whenever `history` is truncated for a week pick per `engine.run_queue`) and that NSE's trading calendar has no gap spanning that week - a holiday-shifted week could misalign the marker by a day or two, same blur family C01/C02 already accept."
  - "`expiry_futstk` is the *modal* near-month expiry across `has_future` rows on a date (`strategies/c04_common.py`), a robustness choice against stray per-symbol data quirks, not a per-symbol signal - every eligible symbol still gets the identical market-wide score."
  - "MIN_OCCURRENCES=20 (the same round number C01/C02 use) is not tuned - a `tune`-lane candidate once either variant has a real train edge worth tuning (SPEC.md section 8)."
  - "D02 (stock put-call ratio) remains blocked - the expiry-date extension this card unlocks is about futures' own expiry schedule, not options OI, which is a separate, larger parse (`state/queue.md`'s D1 entry)."
  - "No claim is assumed true (SPEC.md section 5): status moves to confirmed/refuted only after a real train (then validation/test) replay of each variant, not from this card's own reasoning about why the proxy should track the catalog's literal claim."
