claim_as_stated: >
  Standard F&O desk reading of a day's own price move alongside its own
  change in open interest: price up with OI up is "long build-up" (read as
  bullish - fresh long positions being added with conviction); price down
  with OI up is "short build-up" (read as bearish - fresh shorts being
  added with conviction); price down with OI down is "long unwinding"
  (existing longs exiting - bearish, but read as weaker than a short
  build-up since it is position-closing, not fresh conviction); price up
  with OI down is "short covering" (existing shorts exiting - bullish, but
  weaker than a long build-up for the same reason). This is commentary on
  the session that just happened, not stated anywhere as a forward-looking
  signal for the next session - untested here (SPEC.md section 5: "no
  claim is assumed true") until a real train replay says whether yesterday's
  classification has any predictive value for today's pick at all.
horizon: day
rules_plain: >
  The catalog's own classification (`price up/down` x `OI up/down`) is
  computed from one session's own close vs. its own prevclose and that same
  session's own change in open interest - exactly the information
  `engine/replay.py`'s `truncate()` withholds from a day-horizon strategy
  about the pick date itself, the identical wall `cards/A09.yml` hit for gap
  fade. Ported honestly as a one-day lag instead: `history`'s last visible
  row (the trading session immediately before the pick date, after
  truncation) is classified build-up/unwind/covering from its own
  `close`/`prevclose` and `oi_chg_futstk`, and that classification's implied
  direction is used to score the *next* session (the pick date) - the same
  "does yesterday's pattern carry forward" reinterpretation A09 used for its
  gap, not a same-day leak.

  For the last visible row: `price_move = (close - prevclose) / prevclose`.
  `direction = sign(price_move)` (abstain if exactly zero - no move, no
  clear direction, same reasoning B5's "no move at all counts as a miss"
  gives scoring generally). `prior_oi = oi_futstk - oi_chg_futstk` (the FO
  bhavcopy's own `OPEN_INT`/`CHG_IN_OI` pair already gives today's OI level
  and today's change in it, so yesterday's starting OI is just the
  difference). `oi_pct_chg = oi_chg_futstk / prior_oi` (abstain if
  `prior_oi` is zero, negative or missing - undefined base).

  `score = direction * abs(oi_pct_chg) * weight`, where `weight = 1.0` if
  `oi_chg_futstk > 0` (a build-up - direction read at full strength, matching
  the catalog's "long/short build-up" wording) and `weight = WEAK_WEIGHT`
  (0.5, a strategy parameter) if `oi_chg_futstk <= 0` (unwinding or
  covering - same direction as the price move, but read at half strength,
  matching the catalog's own "treated as weaker" instruction literally: the
  *sign* still follows the price move in every quadrant exactly as the
  catalog's four-way table says, only the *magnitude* is damped for the two
  closing-position quadrants).

  A symbol whose last visible row has no active future (`has_future` false,
  so no `oi_futstk`/`oi_chg_futstk` at all - D1's own partial-dataset
  caveat), or whose `oi_chg_futstk`/`oi_futstk`/`prevclose` is missing or
  zero in a way that makes the arithmetic above undefined, abstains for
  that pick date rather than guessing.
default_params:
  weak_weight: 0.5
