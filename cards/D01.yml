red_flags:
  - "Same-day-information wall, same shape as A09 (`cards/A09.yml`): the catalog's literal classification uses the pick session's own close and own OI change, which `truncate()` correctly withholds from a day-horizon strategy (B4). Ported as a one-day lag (yesterday's build-up/unwind pattern predicting today's open-to-close move) instead of the literal same-day reading - a real behavioural claim (does yesterday's positioning pattern carry forward one session?), not the originally-stated same-session commentary. Train results below test the lagged claim, not the desk's literal same-day one."
  - "`weak_weight` (0.5) is this card's own choice for how much lighter unwinding/covering should read versus build-up - the catalog gives no numeric ratio, only 'weaker' in words. Not tuned; a `tune`-lane candidate once this has a train edge worth tuning at all."
  - "D1 is explicitly partial (`state/queue.md`): near-month (soonest-expiry) futures OI only, dropping the next/far-month contracts entirely when more than one expiry trades the same symbol-day, and covering stock futures only (no options OI yet - that's D02, still blocked). A symbol can look OI-silent here on a day it actually had live OI in a further-dated contract; not expected to matter much (the near-month contract usually carries the bulk of open interest) but not measured."
  - "No separate week-horizon variant: the catalog's own `horizon` field for D01 is `day` only, and daily OI build-up/unwind is inherently a session-level classification - there is no natural 'weekly OI build-up' reading to lag into a week pick without inventing a new rule the catalog doesn't state, so none is ported."
  - "No claim is assumed true (SPEC.md section 5): this card's status moves to confirmed/refuted only after a real train (then validation/test) replay, not from desk convention or this card's own reasoning about why the lag should carry forward."
