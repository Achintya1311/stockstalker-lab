  - "No claim is assumed true (SPEC.md section 5): status moves to confirmed/refuted only after a real train (then validation/test) replay, not from the catalog's own 'weak evidence at short horizons' prior."
  - "20/50 is the conventional pair, not tuned on NSE data at all - a `tune`-lane candidate once a real train edge exists worth tuning (SPEC.md section 8)."
