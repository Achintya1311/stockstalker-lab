author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#101"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#101 = (close - open) / ((high - low) + 0.001), a
  production WorldQuant alpha with a holding period of days; the paper reports no
  stand-alone hit rate. Its sign reads a bar that closes near its high as bullish.
horizon: day
rules_plain: >
  On the adjusted last bar: score = (close - open) / (high - low). Positive (closed
  above the open, near the high) bullish, negative bearish. A zero-range bar or a
  doji (close equal to open) abstains; the paper's +0.001 is dropped because
  adjusted prices are not on one scale. Only the last 2 rows are read.
