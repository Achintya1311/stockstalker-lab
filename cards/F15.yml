red_flags:
  - "Pre-declared before the replay (6 Nov 2026): the streak takes only seven values, so the turnover ratio decides the top five within the extreme streaks. The bearish five are three-up-close names on light recent turnover, a quiet drift up, which is not what A01 fades (A01's bearish five are last week's biggest risers, usually on heavy trading). Prediction: week bearish -0.5 to +2.5 with dir -0.15% to +0.15%; week bullish -2.0 to +2.0 with a negative dir (0.415% delivery cost); top-5 bearish overlap with A01 below 20%. Helps, bearish (full SPEC 10 rule): +2.0, interval above 0, 4 of 6 years, positive dir; replaces A01 only with a released edge at least 1 point above +4.73. Helps, bullish (AB's edge-only rule): +2.0, interval above 0, 4 of 6 years; replaces A05B only with a released edge above +3.23."
  - "Three daily signs at the end of a week say little about a five-session holding period; the paper's alpha was a daily one."
  - "Share volume replaced by turnover (as F09)."
