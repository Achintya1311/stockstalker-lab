source_url: "https://arxiv.org/abs/1601.00991"
author: "Zura Kakushadze, 101 Formulaic Alphas (Wilmott 84, 2016), Alpha#30"
license: "Formula re-implemented from the paper's text; no code copied (SPEC.md section 5)"
published_on: "2016"
claim_as_stated: >
  `cards/catalog.csv` (X03): Alpha#30 = (1 - rank(sign(d1) + sign(d2) + sign(d3))) x sum(volume, 5)
  / sum(volume, 20), with d1..d3 the last three daily close changes. A production WorldQuant alpha:
  a run of down closes on heavy recent volume is favoured. The paper reports no stand-alone hit rate.
horizon: week
rules_plain: >
  On adjusted closes, sum the signs of the last three daily changes (-3 to +3) and percentile-rank
  it among the stocks with a future on the last date; p = (1 - that rank) x last 5 sessions'
  turnover / last 20 sessions'; score = p - median(p). Three down closes on heavy recent turnover
  bullish; three up closes on light turnover bearish. Scored on Friday's close for the next week.
default_params:
  streak: 3
  short: 5
  long: 20
data_needed: "ohlcv"
testable_now: "yes"
source: "Kakushadze (2016) 101 Formulaic Alphas, Wilmott (X03)"
