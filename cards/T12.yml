claim_as_stated: >
  `cards/catalog.csv`'s own reading: "%K crossing up below 20 bullish,
  crossing down above 80 bearish." `prior_claim`: "Oscillator, mean
  reversion." `default_params`: "14,3,3" - the standard Stochastic
  Oscillator triple (%K lookback, %K smoothing, %D smoothing). The
  catalog's literal rule only references %K crossing the two fixed
  thresholds, the same selective-event reading `cards/T03.yml`'s RSI
  30/70 thresholds and `cards/T05.yml`'s MACD crossing already use, not a
  %K/%D crossover (a different, more common retail variant this card does
  not test - see red_flags).
horizon: day
rules_plain: >
  Standard Stochastic Oscillator on the adjusted high/low/close series
  (`scripts.adjustments.compute_adjustment_factors`, same as every other
  `strategies/t0*` card):

  - Raw %K = `100 * (close - lowest_low_14) / (highest_high_14 -
    lowest_low_14)`, over a trailing 14-day window of adjusted high/low.
  - %K (the "slow" or smoothed %K most retail platforms display, and the
    one `default_params`' middle value (3) names): a 3-day simple moving
    average of raw %K.
  - **Bullish:** %K was strictly below 20 on the prior bar and is at or
    above 20 on the latest bar (a fresh cross up through 20, oversold
    reversal) - the same "event, not persisted state" reading
    `cards/T05.yml`'s MACD crossing already uses, since the catalog's own
    wording is "crossing," not "is below."
  - **Bearish:** %K was strictly above 80 on the prior bar and is at or
    below 80 on the latest bar (a fresh cross down through 80, overbought
    reversal).
  - Anything else (no fresh cross through either threshold on this bar)
    abstains (NaN, SPEC.md section 3) - including a %K that has already
    been below 20 (or above 80) for several bars without a fresh cross,
    the same abstain case `cards/T05.yml`'s "already crossed, no fresh
    cross" scenario documents.

  Score is continuous within each firing case, reusing `cards/T03.yml`'s
  threshold-distance convention rather than T05's price-denominated one
  (this rule's two thresholds, 20 and 80, are symmetric around 50 with
  the same 20-point distance to each series boundary (0, 100) that T03's
  30/70 thresholds have to their own boundaries, so the identical
  `(threshold - value) / distance` shape applies directly): on a bullish
  cross, `score = (20 - k_prev) / 20` (0 at the boundary, 1.0 as k_prev
  approaches 0); on a bearish cross, `score = -(k_prev - 80) / 20` (0 at
  the boundary, -1.0 as k_prev approaches 100). `k_prev`, not `k_latest`,
  sets the magnitude deliberately: it is how oversold/overbought the
  prior bar was that makes the fresh cross notable, and `k_latest` is
  constrained to sit just the other side of the threshold by the cross
  condition itself, so it carries little extra information about
  conviction.

  `strategies/t12_stochastic.py` needs no pick-date knowledge - both the
  rolling high/low window and the %K smoothing are computed purely from
  past adjusted prices already inside whatever truncated `history` slice
  `engine.replay` hands this module. Catalog lists this card's horizon as
  day only (unlike T01/T03/T05's "both"), so only a day-split experiment
  is queued.

  Minimum history: the 14-day rolling high/low window needs 14 rows
  before raw %K is a real value (not a partial-window artefact), and the
  3-day SMA on top of it needs 3 consecutive raw %K values, so smoothed
  %K is first valid at row index `14 + 3 - 2 = 15` (0-indexed) - one more
  row than that (`MIN_ROWS = 14 + 3 = 17`) so a prior-bar smoothed %K
  value also exists to compare against for the cross itself, the same
  "+1 row for the prior-bar comparison" reasoning every event-based card
  here (T05, and now this one) already uses.
default_params:
  k_period: 14
  k_smooth: 3
  d_smooth: 3
