red_flags:
  - "No claim is assumed true (SPEC.md section 5): status moves to confirmed/refuted only after a real train (then validation/test) replay - same caveat every ported card here already carries."
  - "Reading \"close at a 20-day high\" against the PRIOR window (excluding today) rather than a window including today is an interpretation choice forced by the self-referential degeneracy of the literal-inclusion reading, not the only possible parse - flagged the same way T07's \"same-bar squeeze-and-break\" choice is, for the same reason (if this card shows no edge, worth re-checking before concluding the underlying claim is refuted)."
  - "Faith's own system also carries a stop-loss, position-sizing (N-ATR) rule, and a System-1 entry that's skipped after a prior winning breakout (\"last trade was a winner\") - this card tests only the entry signal itself (the engine scores open-to-close per pick, not a held position with an exit rule), same \"the narrowest claim this interface can test\" scoping T04 and T07 already flag for their own simplifications."
  - "Selective by construction (abstains unless today is a genuine new high/low over the window), likely with much lower coverage at window=55 than window=20 on the same history since a 55-day extreme is rarer by construction: coverage (SPEC.md section 3) needs reporting alongside any accuracy figure once engine/experiment_report.py (state/engine-issues.md) can score this card's picks, same blocker every ported card since A01 has hit."
  - "Pick overlap between the 20-day and 55-day variants (SPEC.md section 6 gate 8) needs checking directly once both have real numbers - a 55-day new high is necessarily also inside a 20-day lookback's range much of the time, so the two variants' fires are not independent by construction, even though they can disagree on any given bar."
  - "Shares the same trend-following intuition as T01's SMA crossover and T02's golden/death cross but reads price extremes directly rather than through a moving average - pick overlap with T01/T02 (SPEC.md section 6 gate 8) is worth checking directly once all three have real numbers, not assumed from the shared trend-following framing."
