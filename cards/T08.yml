claim_as_stated: >
  `cards/catalog.csv`'s own reading: "Close at a 20-day high bullish, at
  a 20-day low bearish (55-day variant too)." `prior_claim`:
  "Trend-following on futures; test on stock futures." `default_params`:
  "20 and 55" - the Turtle System 1 (20-day) and System 2 (55-day)
  breakout windows, both named explicitly in the catalog's own default,
  tested here as two separate catalog-stated variants, not one default
  and one unstated tune-lane alternative - the same shared-core shape
  `cards/D02.yml` already uses for its own two catalog-stated variants.
horizon: week
rules_plain: >
  Faith's own Turtle rule reads "price exceeds the highest high of the
  preceding N days" - a breakout against the window BEFORE today, not
  "today's close is the max of a window that includes itself." The
  latter is true of every bar by construction (a value is always <= the
  max of a set containing itself) and could never distinguish a real
  breakout from an ordinary one.
  `strategies/t08_donchian_breakout_core.py` reads the catalog's "close
  at a 20-day high" the narrowest way consistent with that: today's
  adjusted close strictly above the PRIOR `window` sessions' highest
  close is bullish, strictly below the prior `window` sessions' lowest
  close is bearish; a tie (close exactly equal to the prior high/low)
  does not count as a new breakout and abstains, same as everything
  else inside the range.

  Both catalog-stated windows share this core (`core.score(history,
  window=...)`), differing only in `window`:
  `strategies/t08_donchian_breakout_20.py` (window=20, Turtle System 1)
  and `strategies/t08_donchian_breakout_55.py` (window=55, Turtle
  System 2) - two independent trials, neither assumed the "real" one
  (SPEC.md section 5: no claim is assumed true).

  Score is continuous, same sign-gives-direction/magnitude-gives-
  conviction convention every other card here uses:
  `(close - prior_high) / abs(prior_high)` when bullish,
  `(close - prior_low) / abs(prior_low)` when bearish (already negative
  since close < prior_low there) - both scaled by the breakout level
  itself so the same point move reads as a larger conviction on a
  cheaper stock, consistent with every other percentage-based card here
  (T01, T02, T07).

  Needs no pick-date knowledge - the rolling high/low is computed purely
  from past adjusted closes already inside whatever truncated `history`
  slice `engine.replay` hands this module. Minimum history:
  `window + 1` rows (the `window` prior sessions plus today's own row);
  only the trailing `window + 1` rows of adjusted close are ever used
  per symbol, same fixed-size-tail convention T06/T07 already use
  (`state/engine-issues.md`'s "Replay took 1h45m+" WATCH entry).

  Catalog lists this card's horizon as week only, so only a week-split
  experiment is queued for each variant.
default_params:
  window_system1: 20
  window_system2: 55
