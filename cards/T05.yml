claim_as_stated: >
  `cards/catalog.csv`'s own reading: "MACD line crossing above signal
  bullish, below bearish." `prior_claim`: "Common retail signal." The
  catalog's wording is explicitly an event ("crossing"), not a persisted
  state ("is above") the way `cards/T01.yml`'s SMA spread reads - so unlike
  T01/T03/T04, this card only fires on the bar where the two lines actually
  cross, and abstains on every other bar even if MACD sits well above (or
  below) its signal line without a fresh cross that day.
horizon: both
rules_plain: >
  Standard MACD(12, 26, 9) on the adjusted close series
  (`scripts.adjustments.compute_adjustment_factors`, same as every other
  `strategies/t0*` card):

  - MACD line = EMA(12) - EMA(26), both plain (non-Wilder) exponential
    moving averages (`close.ewm(span=N, adjust=False).mean()` - pandas'
    own recursive EMA, seeded by the first observation; this is a
    different smoothing convention from `strategies/t03_rsi_thresholds.py`/
    `strategies/t04_connors_rsi2.py`'s hand-seeded Wilder smoothing
    (`alpha=1/period`), because MACD's own published definition is a plain
    EMA, not Wilder's).
  - Signal line = EMA(9) of the MACD line itself.
  - **Bullish:** MACD line was at or below the signal line on the prior
    bar and is strictly above it on the latest bar (a fresh cross up).
  - **Bearish:** MACD line was at or above the signal line on the prior
    bar and is strictly below it on the latest bar (a fresh cross down).
  - Anything else (no fresh cross this bar) abstains (NaN, SPEC.md
    section 3).

  Score is continuous within each firing case, same sign-gives-direction/
  magnitude-gives-conviction convention every other card here uses:
  `score = (macd_latest - signal_latest) / abs(close_latest)` - normalised
  by the latest adjusted close since MACD is price-denominated (an
  absolute EMA difference), not already a ratio the way T01's SMA spread
  or T03/T04's RSI readings are. The sign of this expression always
  matches the cross direction by construction (positive just after a
  cross up, negative just after a cross down), so no separate sign check
  is needed once a fresh cross is confirmed.

  `strategies/t05_macd_crossover.py` needs no pick-date knowledge - both
  EMAs and the cross comparison are computed purely from past adjusted
  closes already inside whatever truncated `history` slice `engine.replay`
  hands this module, so one module serves both horizons, the same way
  `strategies/t01_sma_crossover.py` and `strategies/t03_rsi_thresholds.py`
  already do.

  Minimum history: the slow (26-day) EMA and the 9-day signal EMA on top
  of it need at least 26 + 9 = 35 rows before the signal line is read as
  a stable value (not pandas' own unseeded-recursion value from only a
  handful of rows), plus one more row to have a prior-bar signal/MACD
  pair to compare against for the cross itself - `MIN_ROWS = 36`.
default_params:
  fast: 12
  slow: 26
  signal: 9
