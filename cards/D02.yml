red_flags:
  - "The catalog explicitly disputes the direction of this effect ('contrarian or confirmatory, test both') - ported as two separate strategy variants sharing one core module (`strategies/d02_stock_pcr_core.py`), rather than this card picking a side. Both are independent trials in `ledger/trials.csv` once queued through `gates/trials.py`."
  - "The 2.0 z-score threshold and 20-session window are this card's own choice, reused from D03's catalog-stated 'z > 2 vs 20-day' for consistency, not from any source this card cites for PCR specifically. A `tune`-lane candidate on train, once either variant shows an edge worth tuning at all."
  - "PCR uses near-month stock OPTIONS open interest only (D1's options-OI continuation), independent of the near-month FUTURES OI D01 uses - a symbol can have an active future with no liquid options market at all on a given date (illiquid names), in which case `oi_ce_optstk`/`oi_pe_optstk` are NaN (left join) and this card abstains, same as D01 abstaining when a future itself is inactive."
  - "The z-score's own mean/std window includes the session being scored (Bollinger-band convention, matching D03's planned reading of the same style of threshold) - not a separate out-of-window baseline. A trailing-19-plus-current window is still fully causal (every session in it is at or before `history`'s own last visible row, which `engine/replay.py`'s `truncate()` already keeps strictly before the pick date/week), but it does mean an unusually large single session can shift its own baseline, which a future diagnostics pass should check for (e.g. one huge OI print dominating its own 20-session mean)."
  - "No claim is assumed true (SPEC.md section 5): this card's status moves to confirmed/refuted per variant only after a real train (then validation/test) replay, not from this card's own reasoning about which reading is more plausible."
