claim_as_stated: >
  Extreme put/call open interest ratio (PCR) on a stock's own near-month
  options signals something about the stock's near-term direction, but the
  catalog itself flags the direction of the effect as disputed: a
  "contrarian" read treats an extreme-high PCR (relatively many puts) as
  excessive bearish hedging/positioning that is more likely to reverse
  (bullish), and an extreme-low PCR (relatively many calls) as excessive
  bullish positioning that is more likely to reverse (bearish); a
  "confirmatory" read treats the same extremes as the market's positioning
  being informed and likely to persist (extreme-high PCR -> bearish,
  extreme-low PCR -> bullish). SPEC.md section 5: "no claim is assumed
  true" - both readings are ported as separate, equally untested variants
  rather than picking one.
horizon: week
rules_plain: >
  PCR for a session = `oi_pe_optstk / oi_ce_optstk` (D1's options-OI
  continuation: near-month stock-option open interest, puts over calls,
  already summed by option type across strikes in
  `scripts/build_dataset.py`). Undefined (abstain for that session) when
  `oi_ce_optstk` is zero, NaN, or missing, or `oi_pe_optstk` is NaN or
  missing.

  "Extreme" is a z-score against the *same symbol's own* trailing 20-session
  PCR distribution, Bollinger-band style - the session itself is the most
  recent of the 20 used to compute the mean/std, not a separate forward
  window: `z = (pcr_last - mean(pcr, last 20 valid sessions)) /
  std(pcr, last 20 valid sessions)`. A symbol abstains unless it has at
  least 20 valid (non-abstaining) trailing PCR sessions and a non-zero
  standard deviation, and then only scores if `|z| >= 2.0`; the catalog
  gives no numeric threshold, so this card reuses D03's own "z > 2 vs
  20-day" convention for consistency across the two OI/flow-extreme cards
  in this family rather than inventing a different number.

  Both variants read from `history`'s own last visible row only (the same
  "last visible row" convention `cards/D01.yml` uses to lag a day-horizon
  rule; here it lags one week, since this card's horizon is `week` per the
  catalog) and share every line of logic except the final sign:
  - **Contrarian** (`strategies/d02_stock_pcr_contrarian.py`): `direction =
    sign(z)` - extreme-high PCR (z > 0) scores bullish, extreme-low scores
    bearish.
  - **Confirmatory** (`strategies/d02_stock_pcr_confirmatory.py`):
    `direction = -sign(z)` - extreme-high PCR scores bearish, extreme-low
    scores bullish.
  `score = direction * abs(z)` for whichever variant; magnitude is the same
  for both on the same symbol/date, only the sign differs.
default_params:
  threshold_z: 2.0
  window: 20
data_needed: "FO bhavcopy options OI (D1's options-OI continuation, 22 Oct: near-month stock-option OI summed by type, oi_ce_optstk/oi_pe_optstk)"
