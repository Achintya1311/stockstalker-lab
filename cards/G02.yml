source_url: "https://quantpedia.com/strategies/betting-against-beta-factor-in-stocks"
author: "Andrea Frazzini and Lasse Heje Pedersen, Betting Against Beta, Journal of Financial Economics 111(1), 2014"
license: "Idea from the paper, summarised and re-implemented (SPEC.md section 5)"
published_on: "2014"
claim_as_stated: >
  `cards/catalog.csv` (X04 and the paper): low-beta assets earn higher risk-adjusted
  returns than high-beta assets, across stock markets and asset classes.
horizon: week
rules_plain: >
  On adjusted closes: m = equal-weighted mean daily log return of the F&O stocks
  visible each date; beta of each stock against m over the last 250 sessions, shrunk
  as 0.6 x beta + 0.4; score = 1 - shrunk beta. Below-market beta bullish, above-market
  beta bearish. A gap in the window abstains. The paper's 5-year correlation and 1-year
  volatility are folded into one 1-year beta, and its leverage-neutral long-short is
  left out: the lab ranks, it does not size.
default_params:
  beta_window: 250
  shrink: 0.6
data_needed: "ohlcv"
testable_now: "yes"
source: "Frazzini and Pedersen (2014) J. Financial Economics; Quantpedia (X04)"
link: "https://quantpedia.com/strategies/betting-against-beta-factor-in-stocks"
prior_claim: "Low-beta assets earn higher risk-adjusted returns than high-beta assets across markets"
