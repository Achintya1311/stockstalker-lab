red_flags:
- No claim is assumed true (SPEC.md section 5).
- 28 cells and their 28 complements are queued together on 12 Nov 2026; the engine records every scored train replay in ledger/trials.csv
  (one row per side), so the trial count rises before any result is read.
- Complement cells are placebos for the gate, not hypotheses; a gate that only shrinks coverage is not a success.
- For A01 and A05B (continuous scores) a cell's top-5 is the strongest trigger readings that pass the gate, not the trigger's
  own top-5 then gated; the all-picks selection is the trigger's side, gated.
- G5 gives one verdict per date for every pick, so its cells are a date filter; coverage is read next to edge.
- G4 is a gap proxy for news; there is no earnings calendar in the dataset.
- Train split only until a composite is frozen (C2).
