source_url: ''
author: lab-original ingredient test (C1); literature per gate in RESEARCH.md section 2
license: own work, summarised only (SPEC.md section 5)
published_on: '2026-11-12'
horizon: day and week (each cell uses its trigger's horizon)
claim_as_stated: 'Pre-registered hypothesis, fixed before any replay: each gate improves its trigger''s train edge. Judged
  per cell against the trigger alone and against the cell''s complement (trigger AND NOT gate). C2 rule (RESEARCH.md section
  5): a gate qualifies only if its edge difference against the trigger has an interval above zero, is positive in at least
  4 of 6 train years, and it beats its own complement.'
rules_plain: 'Eight keep-only gates G1-G8 (trend side, not fading a leader, stock-specific move, no-news gap proxy, market
  stress, order-block location, OI state, volume surge) applied to the four live triggers'' own table side: E2A day bearish,
  T04 day bullish, A05B week bullish, A01 week bearish. Exact rules per trigger in the docstring of strategies/g_gates.py.
  Thresholds are the round numbers in RESEARCH.md section 4; none is tuned.'
default_params:
  g1: 200-day average
  g2: 63-day rank top/bottom 30% and 200-day average
  g3: equal-weight universe return, same window; E2A residual z >= 1.0
  g4: gap over 1 sigma of the prior 20 gaps
  g5: 20-day universe volatility above its 250-day median
  g6: ob_core.detect defaults, last 60 bars
  g7: D01C sign
  g8: volume over 1.5x the prior 20-day mean
data_needed: ohlcv, futures OI
testable_now: 'yes'
source: finance-portfolio-hub projects/combined-strategy/RESEARCH.md sections 4-5 (12 Nov 2026)
link: ''
prior_claim: Da, Liu and Schaumburg (2014); Nagel (2012); Connors RSI-2 practice; trend-template checklists; lab results E2A,
  D01C, E1A
