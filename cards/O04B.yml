claim_as_stated: 'Pre-registered before the replay. O04 lost to O01 alone on all four train cells (O04 / O01 top-5 edge:
  day bullish -1.16 / -0.47, day bearish -0.65 / +0.66, week bullish -2.95 / -2.21, week bearish -0.44 / +0.18;
  research/diagnostics/o04.md). In any cell, the D01 ingredient is named as what made O04 worse if O04B''s top-5 edge
  there is at least 1 point above O04''s. The order-block composite helps only if O04B beats O01 alone by at least 1 point
  in a cell with a positive directional move after costs. Expected: O04B above O04 on the day cells (D01 is confidently
  wrong on both sides, research/diagnostics/d01.md) but not above O01 alone, since the remaining non-O01 ingredient, the
  volume z, is noise in either sign (research/diagnostics/a07c.md). Any gain is a lead needing validation, not a result.'
rules_plain: 'O04 with the D01 OI ingredient removed: among the stocks O01 finds at an order-block zone, rank O01''s
  proximity and A07''s volume z (aligned to the zone''s side) across those stocks, average the two ranks (skipping one that
  abstains), and sign by the zone''s side. Imports O04''s readings, so everything except the ingredient list is identical.'
