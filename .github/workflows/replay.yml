name: Replay
# The lab's compute. The routine queues experiments as files; this job runs them against
# the cached dataset with engine/run_queue.py (written in build items B4-B8) and commits
# only the results the engine is allowed to reveal (train metrics, holdout answers, test
# looks within budget). The data itself never leaves the Actions cache.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['experiments/pending/**', 'strategies/**', 'engine/**', 'gates/**']
permissions:
  contents: write
concurrency: replay
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}   # latest main, not the triggering commit: an older checkout is what made queued runs conflict
      - name: Skip until the engine exists, or if this push changed protected paths (Guard undoes those)
        id: has
        run: |
          [ -f engine/run_queue.py ] || { echo "engine not written yet"; exit 0; }
          if [ "${{ github.event_name }}" = push ]; then
            bad=$(bash .github/guard.sh ${{ github.event.before }} ${{ github.sha }})
            [ -z "$bad" ] || { echo "protected paths changed without supervision, not replaying:"; echo "$bad"; exit 0; }
          fi
          echo "ok=1" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.has.outputs.ok
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
        if: steps.has.outputs.ok && hashFiles('requirements.txt') != ''
      - uses: actions/cache/restore@v4
        if: steps.has.outputs.ok
        with: {path: data, key: nse-dataset-none, restore-keys: nse-dataset-}
      - name: Run queued experiments
        if: steps.has.outputs.ok
        run: set -o pipefail; python3 -m engine.run_queue --data data/dataset.parquet 2>&1 | tee /tmp/replay.log
      - name: Commit results
        if: steps.has.outputs.ok
        run: |
          bash .github/push.sh "replay: results $(date -u +%FT%H%MZ)" ledger reports experiments
      - name: Report failure where the routine can read it
        if: failure() && steps.has.outputs.ok
        run: |
          bash .github/report_failure.sh replay /tmp/replay.log
