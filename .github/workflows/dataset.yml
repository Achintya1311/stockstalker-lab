name: Build dataset
# Rebuilds the parsed dataset from scratch on every run, from the per-year raw caches
# (backfill.yml) plus an accumulating cache of recent days fetched here. A full rebuild
# is slower than an append but cannot silently miss years. Only a manifest (date range,
# rows, checksum) is committed.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backfill NSE history"]
    types: [completed]
  push:
    branches: [main]
    paths: [scripts/build_dataset.py]
  schedule:
    - cron: '23 13 * * 1-5'   # 18:53 IST, weekdays
permissions:
  contents: write
concurrency: dataset
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the builder exists
        id: has
        run: if [ -f scripts/build_dataset.py ]; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "build_dataset.py not written yet"; fi
      - uses: actions/setup-python@v5
        if: steps.has.outputs.ok
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
        if: steps.has.outputs.ok && hashFiles('requirements.txt') != ''
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2015, key: nse-raw-2015-x, restore-keys: nse-raw-2015-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2016, key: nse-raw-2016-x, restore-keys: nse-raw-2016-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2017, key: nse-raw-2017-x, restore-keys: nse-raw-2017-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2018, key: nse-raw-2018-x, restore-keys: nse-raw-2018-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2019, key: nse-raw-2019-x, restore-keys: nse-raw-2019-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2020, key: nse-raw-2020-x, restore-keys: nse-raw-2020-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2021, key: nse-raw-2021-x, restore-keys: nse-raw-2021-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2022, key: nse-raw-2022-x, restore-keys: nse-raw-2022-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2023, key: nse-raw-2023-x, restore-keys: nse-raw-2023-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2024, key: nse-raw-2024-x, restore-keys: nse-raw-2024-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2025, key: nse-raw-2025-x, restore-keys: nse-raw-2025-}}
      - {uses: actions/cache/restore@v4, if: steps.has.outputs.ok, with: {path: raw/2026, key: nse-raw-2026-x, restore-keys: nse-raw-2026-}}
      - name: Restore days fetched by earlier runs
        if: steps.has.outputs.ok
        uses: actions/cache/restore@v4
        with: {path: raw/recent, key: nse-raw-recent-x, restore-keys: nse-raw-recent-}
      - name: Fetch the last 10 calendar days (skips files already present)
        if: steps.has.outputs.ok
        run: python3 scripts/fetch_bhavcopy.py --start $(date -u -d '10 days ago' +%F) --end $(date -u +%F) --out raw/recent
      - uses: actions/cache/save@v4
        if: steps.has.outputs.ok
        with: {path: raw/recent, key: 'nse-raw-recent-${{ github.run_id }}'}
      - name: Build or update
        if: steps.has.outputs.ok
        run: rm -rf data; set -o pipefail; python3 scripts/build_dataset.py --raw raw --out data/dataset.parquet --manifest state/data_manifest.json 2>&1 | tee /tmp/dataset.log
      - uses: actions/cache/save@v4
        if: steps.has.outputs.ok
        with: {path: data, key: 'nse-dataset-${{ github.run_id }}'}
      - name: Corporate-actions report for B3 (written once; delete the file to regenerate)
        if: steps.has.outputs.ok && hashFiles('scripts/check_corporate_actions.py') != '' && hashFiles('reports/corporate_actions_check.md') == ''
        run: set -o pipefail; python3 scripts/check_corporate_actions.py --data data/dataset.parquet --out reports/corporate_actions_check.md 2>&1 | tee -a /tmp/dataset.log
      - name: Commit the manifest and report only
        if: steps.has.outputs.ok
        run: |
          bash .github/push.sh "data: manifest $(date -u +%F)" state/data_manifest.json reports/corporate_actions_check.md
      - name: Report failure where the routine can read it
        if: failure() && steps.has.outputs.ok
        run: |
          bash .github/report_failure.sh dataset /tmp/dataset.log
