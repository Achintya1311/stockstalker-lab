name: Archive 5-minute bars
# Yahoo keeps only the last 60 days of 5-minute bars, so this archives them daily. The bars live in the
# Actions cache only (never committed or published, like the NSE files); only a coverage manifest is
# committed. Running daily also keeps the cache entry from expiring (GitHub drops entries unused for 7 days).
on:
  workflow_dispatch:
  schedule:
    - cron: '45 10 * * 1-5'   # 16:15 IST, after the close
permissions:
  contents: write
concurrency: intraday
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with: {path: intraday, key: intraday-5m-none, restore-keys: intraday-5m-}
      - name: Fetch and merge
        run: set -o pipefail; python3 scripts/fetch_intraday.py --store intraday/5m.parquet --manifest state/intraday_manifest.json 2>&1 | tee /tmp/intraday.log
      - uses: actions/cache/save@v4
        with: {path: intraday, key: 'intraday-5m-${{ github.run_id }}'}
      - name: Commit the manifest only
        run: bash .github/push.sh "data: intraday manifest $(date -u +%F)" state/intraday_manifest.json
      - name: Report failure where the routine can read it
        if: failure()
        run: bash .github/report_failure.sh intraday /tmp/intraday.log
